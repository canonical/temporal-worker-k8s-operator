[project]
name = "temporal-worker-k8s-operator"
version = "0.0"
requires-python = ">=3.10,<3.13"

[project.optional-dependencies]
# Runtime deps
charm = [
    "ops==2.21.1",
    "hvac==2.3.0",
    "cosl==0.0.6",
    "pytest-interface-tester==3.3.1",
]

# Unit test deps
unit = [
    "coverage[toml]==6.4.4",
    "ipdb==0.13.9",
    "pytest==7.1.3",
    "hvac==2.3.0",
    "cosl==0.0.6",
    "ops[testing]==2.21.1",
    "ops==2.21.1",
    "pytest-interface-tester==3.3.1",
    "ops-scenario==7.21.1",
]

# Integration test deps
integration = [
    "ipdb==0.13.9",
    "juju==3.5.2.1",
    "pytest==7.1.3",
    "pytest-operator==0.31.1",
    "temporal-lib-py==1.4.3",
    "pytest-asyncio==0.21",
    "poetry==1.8.3",
    "hvac==2.3.0",
    "ops==2.21.1",
    "pytest-interface-tester==3.3.1",
    "ops-scenario==7.21.1",
    "flake8-docstrings-complete>=1.0.3",
    "flake8-test-docs>=1.0",
]

# Static analysis / linting
lint = [
    "mypy",
    "pylint",
    "pydocstyle",
    "pytest",
    "black==22.8.0",
    "codespell==2.2.1",
    "flake8==7.0.0",
    "flake8-builtins==1.5.3",
    "flake8-copyright==0.2.4",
    "flake8-docstrings==1.6.0",
    "isort==5.10.1",
    "pep8-naming==0.13.2",
    "pyproject-flake8==7.0.0",
]

# Formatting
fmt = [
    "black==22.8.0",
    "isort==5.10.1",
]

# Convenience bundle for developers
dev = [
    "temporal-worker-k8s-operator[charm,unit,integration,lint,fmt]",
]

[tool.bandit]
exclude_dirs = ["/venv/"]
[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Formatting tools configuration
[tool.black]
line-length = 120
target-version = ["py38"]

[tool.isort]
profile = "black"

# Linting tools configuration
[tool.flake8]
max-line-length = 120
max-doc-length = 120
max-complexity = 10
exclude = [".git", "__pycache__", ".tox", "build", "dist", "*.egg_info", "venv"]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
# Ignore W503, E501 because using black creates errors with this
# Ignore D107 Missing docstring in __init__
ignore = ["W503", "E501", "D107"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104"]
docstring-convention = "google"
# Check for properly formatted copyright header in each file
copyright-check = "True"
copyright-author = "Canonical Ltd."
copyright-regexp = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+%(author)s"
